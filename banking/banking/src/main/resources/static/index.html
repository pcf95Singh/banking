<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butkun Banking Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

<nav class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wide">🏛️ Global Banking Dashboard</h1>
        <span class="text-sm bg-indigo-700 px-3 py-1 rounded">Dev Profile Mode</span>
    </div>
</nav>

<div class="container mx-auto p-6 max-w-7xl grid grid-cols-1 lg:grid-cols-3 gap-8">

    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Onboard New Customer</h2>

        <div id="errorAlert" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded text-sm">
            <p class="font-bold" id="errorSummary"></p>
            <ul id="errorList" class="list-disc list-inside mt-1 space-y-1"></ul>
        </div>

        <form id="userForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">First Name *</label>
                <input type="text" id="firstName" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Middle Name (Optional)</label>
                <input type="text" id="middleName" class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Last Name *</label>
                <input type="text" id="lastName" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <hr class="my-2">

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Email ID *</label>
                <input type="email" id="emailId" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Mobile Number (10 Digits) *</label>
                <input type="text" id="mobileNumber" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">PAN Number *</label>
                <input type="text" id="panNumber" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase">Aadhaar Number (12 Digits) *</label>
                <input type="text" id="aadhaarNumber" required class="w-full mt-1 p-2 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <hr class="my-2">

            <div class="bg-gray-50 p-3 rounded-lg space-y-3">
                <span class="text-xs font-bold text-gray-500 block">ADDRESS DETAILS</span>
                <div>
                    <label class="block text-xs text-gray-600">Address Line 1</label>
                    <input type="text" id="addressLine1" class="w-full mt-1 p-2 border rounded bg-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-600">Address Line 2</label>
                    <input type="text" id="addressLine2" class="w-full mt-1 p-2 border rounded bg-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-600">City</label>
                        <input type="text" id="city" class="w-full mt-1 p-2 border rounded bg-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600">Pincode (6 digits)</label>
                        <input type="text" id="pinCode" class="w-full mt-1 p-2 border rounded bg-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-600">State</label>
                        <input type="text" id="state" class="w-full mt-1 p-2 border rounded bg-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600">Country</label>
                        <input type="text" id="country" class="w-full mt-1 p-2 border rounded bg-white">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white p-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">
                Register Customer
            </button>
        </form>
    </div>

    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-bold text-gray-800">System Registered Profiles</h2>
            <button onclick="fetchUsers()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-3 py-1.5 rounded-md transition">
                🔄 Refresh Table
            </button>
        </div>

        <div id="userCardsContainer" class="space-y-4 max-h-[80vh] overflow-y-auto pr-2">
            <p class="text-gray-400 text-sm text-center py-8">No profile data loaded. Click Refresh to synchronize.</p>
        </div>
    </div>
</div>

<script>
        const API_BASE_URL = '/banking/api/v1/users';

        // Clear Alerts
        function resetAlerts() {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');
            document.getElementById('errorList').innerHTML = '';
        }

        // 1. Fetch and Display Users (GET Method)
        async function fetchUsers() {
            try {
                const response = await fetch(API_BASE_URL);
                if (!response.ok) throw new Error('Failed to retrieve profiles.');

                const data = await response.json();
                const container = document.getElementById('userCardsContainer');
                container.innerHTML = '';

                if(data.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 text-sm text-center py-8">The database is currently empty.</p>`;
                    return;
                }

                data.forEach(user => {
                    const name = user.customerName || { firstName: 'N/A', middleName: '', lastName: '' };
                    const addr = user.customerAddress || { addressLine1: 'N/A', city: 'N/A', pinCode: 'N/A' };

                    const card = `
                        <div class="p-4 border rounded-xl hover:border-indigo-200 transition shadow-sm bg-white relative">
                            <span class="absolute top-4 right-4 bg-gray-100 text-gray-700 text-xs px-2.5 py-0.5 rounded-full font-mono">ID: ${user.id}</span>
                            <h3 class="text-lg font-bold text-indigo-900">${name.firstName} ${name.middleName || ''} ${name.lastName}</h3>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-3 text-sm text-gray-600">
                                <p>📧 <span class="font-medium">Email:</span> ${user.emailId}</p>
                                <p>📱 <span class="font-medium">Mobile:</span> ${user.mobileNumber}</p>
                                <p>🪪 <span class="font-medium">PAN:</span> ${user.panNumber}</p>
                                <p>🆔 <span class="font-medium">Aadhaar:</span> ${user.aadhaarNumber}</p>
                            </div>

                            <div class="mt-3 bg-gray-50 p-2.5 rounded text-xs text-gray-600 border-t">
                                <span class="font-bold text-gray-500 uppercase block tracking-wider mb-1">Postal Address:</span>
                                ${addr.addressLine1 || ''} ${addr.addressLine2 || ''}, ${addr.city || ''}, ${addr.state || ''} - <span class="font-mono font-bold">${addr.pinCode || ''}</span>, ${addr.country || ''}
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                console.error(err);
                alert('Connection error pointing to H2 engine.');
            }
        }

        // 2. Register New User (POST Method)
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            resetAlerts();

            // Constructing Nested JSON Model to precisely match your UserProfile Entity
            const payload = {
                customerName: {
                    firstName: document.getElementById('firstName').value,
                    middleName: document.getElementById('middleName').value,
                    lastName: document.getElementById('lastName').value
                },
                customerAddress: {
                    addressLine1: document.getElementById('addressLine1').value,
                    addressLine2: document.getElementById('addressLine2').value,
                    city: document.getElementById('city').value,
                    pinCode: document.getElementById('pinCode').value,
                    state: document.getElementById('state').value,
                    country: document.getElementById('country').value
                },
                emailId: document.getElementById('emailId').value,
                mobileNumber: document.getElementById('mobileNumber').value,
                panNumber: document.getElementById('panNumber').value,
                aadhaarNumber: document.getElementById('aadhaarNumber').value
            };

            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.status === 201) {
                    alert('🎉 Customer onboarded seamlessly!');
                    document.getElementById('userForm').reset();
                    fetchUsers();
                } else if (response.status === 400) {
                    // Triggers handling of the structure generated by your GlobalExceptionHandler
                    const errorData = await response.json();
                    displayErrors(errorData);
                } else {
                    alert('Internal server error executing write queries.');
                }
            } catch (err) {
                console.error(err);
                alert('Network drop or CORS blocking error configuration.');
            }
        });

        // Parse and Display Global RestControllerAdvice Field Exceptions
        function displayErrors(errorData) {
            const errorAlert = document.getElementById('errorAlert');
            const errorSummary = document.getElementById('errorSummary');
            const errorList = document.getElementById('errorList');

            errorSummary.innerText = errorData.message || 'Validation Failure';
            errorAlert.classList.remove('hidden');

            if (errorData.details) {
                Object.entries(errorData.details).forEach(([field, msg]) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="font-semibold capitalize">${field.split('.').pop()}:</span> ${msg}`;
                    errorList.appendChild(li);
                });
            }
        }

        // Auto-load profiles on initialize
        window.addEventListener('DOMContentLoaded', fetchUsers);
    </script>
</body>
</html>
